<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ting Ting Flight Booking Admin Dashboard</title>
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-plane"></i>
                <span>Ting Ting Flight Booking Admin</span>
            </div>
            <div class="header-controls">
                <div class="user-info">
                    <span>Admin User</span>
                    <div class="user-avatar">A</div>
                </div>
                <button class="logout-btn" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dashboard -->
    <main class="dashboard-container">
        <!-- Stats Cards -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon bookings">
                    <i class="fas fa-ticket-alt"></i>
                </div>
                <div class="stat-content">
                    <h3>Total Bookings</h3>
                    <div class="stat-value" id="totalBookings">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon passengers">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-content">
                    <h3>Total Passengers</h3>
                    <div class="stat-value" id="totalPassengers">0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon revenue">
                    <i class="fas fa-dollar-sign"></i>
                </div>
                <div class="stat-content">
                    <h3>Total Revenue</h3>
                    <div class="stat-value" id="totalRevenue">$0</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon flights">
                    <i class="fas fa-plane-departure"></i>
                </div>
                <div class="stat-content">
                    <h3>Active Flights</h3>
                    <div class="stat-value" id="activeFlights">0</div>
                </div>
            </div>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search by booking ID, passenger name, or email...">
                </div>
                <div class="filter-group">
                    <label for="dateFilter">Date:</label>
                    <select id="dateFilter">
                        <option value="all">All Dates</option>
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="applyFiltersBtn">
                    <i class="fas fa-filter"></i> Apply Filters
                </button>
                <button class="btn btn-secondary" id="resetFiltersBtn">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </div>

        <!-- Bookings Table -->
        <div class="bookings-section">
            <div class="section-header">
                <h2 class="section-title">Flight Bookings</h2>
                <div class="live-indicator">
                    <div class="live-dot"></div>
                    <span>Live Updates</span>
                </div>
            </div>
            <div class="table-container">
                <table id="bookingsTable">
                    <thead>
                        <tr>
                            <th>Booking ID</th>
                            <th>Passenger</th>
                            <th>Flight</th>
                            <th>Route</th>
                            <th>Date</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Bookings will be inserted here -->
                    </tbody>
                </table>
                <div class="loading-container" id="loadingSpinner" style="display: none;">
                    <div class="spinner"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Booking Details Modal -->
    <div class="modal" id="bookingModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Booking Details</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="booking-details" id="bookingDetails">
                <!-- Booking details will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i class="toast-icon fas fa-check-circle"></i>
        <span class="toast-message">Operation successful</span>
    </div>

    <!-- Firebase SDK -->
<script src="admin.js"></script>
</body>
</html>
